<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Lanite v2.0 · Voice HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #7c6ff7;
            --yellow: #f0c050;
            --red: #f06070;
            --text-2: #a0a0b0;
            --font: 'Inter', system-ui, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 48px;
            font-family: var(--font);
            overflow: hidden;
        }

        /* ── Demo bg ── */
        .demo-bg {
            position: fixed;
            inset: 0;
            background: #0e0e10;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .demo-hint {
            color: rgba(255, 255, 255, 0.1);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .demo-controls {
            display: flex;
            gap: 8px;
        }

        .demo-btn {
            padding: 7px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.15s;
        }

        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
        }

        .demo-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(124, 111, 247, 0.08);
        }

        /* ─────────────────────────────
     THE PILL
  ───────────────────────────── */
        .hud {
            position: relative;
            z-index: 100;

            background: rgba(18, 17, 26, 0.82);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;

            width: 460px;
            height: 64px;

            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 18px;

            opacity: 0;
            transform: translateY(14px) scale(0.95);

            /* Single, clean shadow — no glow */
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.04) inset;

            transition:
                transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1),
                opacity 0.28s ease;
        }

        .hud.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ── Mic icon ── */
        .mic-wrap {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(124, 111, 247, 0.1);
            border: 1px solid rgba(124, 111, 247, 0.18);
            transition: background 0.3s, border-color 0.3s;
        }

        .hud.processing .mic-wrap {
            background: rgba(240, 192, 80, 0.08);
            border-color: rgba(240, 192, 80, 0.2);
        }

        .mic-svg {
            width: 13px;
            height: 13px;
        }

        .mic-fill {
            fill: var(--accent);
            transition: fill 0.3s;
        }

        .mic-stroke {
            stroke: var(--accent);
            transition: stroke 0.3s;
        }

        .hud.processing .mic-fill {
            fill: var(--yellow);
        }

        .hud.processing .mic-stroke {
            stroke: var(--yellow);
        }

        /* ── Waveform ── */
        .wave-wrap {
            flex: 1;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .bar {
            width: 2.5px;
            border-radius: 10px;
            background: var(--accent);
            min-height: 2px;
            opacity: 0.7;
            will-change: height, opacity;
            transition: background 0.3s;
        }

        /* Processing: symmetric slow ripple, no colour flash */
        .hud.processing .bar {
            background: var(--yellow);
            animation: think 1.6s ease-in-out infinite;
            height: 3px !important;
            opacity: 0.5;
        }

        .hud.processing .bar:nth-child(1) {
            animation-delay: 0.00s;
        }

        .hud.processing .bar:nth-child(2) {
            animation-delay: 0.08s;
        }

        .hud.processing .bar:nth-child(3) {
            animation-delay: 0.16s;
        }

        .hud.processing .bar:nth-child(4) {
            animation-delay: 0.24s;
        }

        .hud.processing .bar:nth-child(5) {
            animation-delay: 0.32s;
        }

        .hud.processing .bar:nth-child(6) {
            animation-delay: 0.40s;
        }

        .hud.processing .bar:nth-child(7) {
            animation-delay: 0.48s;
        }

        .hud.processing .bar:nth-child(8) {
            animation-delay: 0.56s;
        }

        .hud.processing .bar:nth-child(9) {
            animation-delay: 0.48s;
        }

        .hud.processing .bar:nth-child(10) {
            animation-delay: 0.40s;
        }

        .hud.processing .bar:nth-child(11) {
            animation-delay: 0.32s;
        }

        .hud.processing .bar:nth-child(12) {
            animation-delay: 0.24s;
        }

        .hud.processing .bar:nth-child(13) {
            animation-delay: 0.16s;
        }

        .hud.processing .bar:nth-child(14) {
            animation-delay: 0.08s;
        }

        .hud.processing .bar:nth-child(15) {
            animation-delay: 0.00s;
        }

        .hud.processing .bar:nth-child(16) {
            animation-delay: 0.08s;
        }

        @keyframes think {

            0%,
            100% {
                height: 2px;
                opacity: 0.2;
            }

            50% {
                height: 16px;
                opacity: 0.6;
            }
        }

        /* ── Divider ── */
        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.07);
            flex-shrink: 0;
        }

        /* ── Status ── */
        .status-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
            min-width: 88px;
        }

        .status-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            white-space: nowrap;
            transition: color 0.3s;
        }

        .hud.listening .status-label {
            color: rgba(167, 139, 250, 0.85);
        }

        .hud.processing .status-label {
            color: rgba(240, 192, 80, 0.75);
        }

        .status-hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            white-space: nowrap;
        }

        /* ── Close ── */
        .close-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
        }

        .close-btn:hover {
            background: rgba(240, 96, 112, 0.1);
            border-color: rgba(240, 96, 112, 0.25);
            color: var(--red);
        }

        .close-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>

    <div class="demo-bg">
          <div class="demo-hint">Voice HUD · Preview</div>
          <div class="demo-controls">
                <button class="demo-btn active" onclick="showState('listening')">Listening</button>
                <button class="demo-btn"         onclick="showState('processing')">Processing</button>
                <button class="demo-btn"         onclick="hideHud()">Hide</button>
              </div>
    </div>

    <!-- THE HUD -->
    <div class="hud visible listening" id="hud">

          <div class="mic-wrap">
                <svg class="mic-svg" viewBox="0 0 13 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                     
                <rect class="mic-fill" x="3.5" y="0" width="6" height="10" rx="3" />
                     
                <path class="mic-stroke" d="M1 8.5C1 11.8 3.46 14.5 6.5 14.5C9.54 14.5 12 11.8 12 8.5"            
                    stroke-width="1.4" stroke-linecap="round" fill="none" />
                     
                <line class="mic-stroke" x1="6.5" y1="14.5" x2="6.5" y2="17.5" stroke-width="1.4"
                    stroke-linecap="round" />
                     
                <line class="mic-stroke" x1="4.5" y1="17.5" x2="8.5" y2="17.5" stroke-width="1.4"
                    stroke-linecap="round" />
                   
            </svg>
              </div>

          <div class="wave-wrap" id="waveWrap"></div>

          <div class="divider"></div>

          <div class="status-area">
                <div class="status-label" id="statusLabel">Listening...</div>
                <div class="status-hint"   id="statusHint">Ctrl+Win to stop</div>
              </div>

          <div class="close-btn" onclick="hideHud()">✕</div>
    </div>

    <script>
        const hud = document.getElementById('hud');
        const waveWrap = document.getElementById('waveWrap');
        const labelEl = document.getElementById('statusLabel');
        const hintEl = document.getElementById('statusHint');

        // Build 16 bars
        const NUM_BARS = 16;
        const bars = [];
        for (let i = 0; i < NUM_BARS; i++) {
            const b = document.createElement('div');
            b.className = 'bar';
            b.style.height = '2px';
            waveWrap.appendChild(b);
            bars.push(b);
        }

        let currentState = 'listening';
        let animFrame;
        let smoothed = new Array(NUM_BARS).fill(0);
        let volume = 0, targetVolume = 0;

        function showState(state) {
            currentState = state;
            hud.classList.remove('listening', 'processing');
            hud.classList.add(state, 'visible');

            const cfg = {
                listening: { label: 'Listening...', hint: 'Ctrl+Win to stop' },
                processing: { label: 'Processing...', hint: 'Transcribing audio' },
            }[state];
            labelEl.textContent = cfg.label;
            hintEl.textContent = cfg.hint;

            document.querySelectorAll('.demo-btn').forEach((b, i) => {
                b.classList.toggle('active', i === (state === 'listening' ? 0 : 1));
            });

            if (state === 'listening') startWave();
            else stopWave();
        }

        function hideHud() {
            stopWave();
            hud.style.transition = 'transform 0.3s ease, opacity 0.25s ease';
            hud.style.transform = 'translateY(12px) scale(0.94)';
            hud.style.opacity = '0';
            document.querySelectorAll('.demo-btn').forEach((b, i) => b.classList.toggle('active', i === 2));
            setTimeout(() => {
                hud.style.transform = '';
                hud.style.opacity = '';
                hud.style.transition = '';
            }, 400);
        }

        // ── Waveform loop ──
        function simulateVol() {
            if (Math.random() < 0.05) targetVolume = 0.15 + Math.random() * 0.85;
            else if (Math.random() < 0.04) targetVolume = Math.max(0, targetVolume - 0.25);
            volume += (targetVolume - volume) * 0.1;
            return volume;
        }

        function drawFrame() {
            if (currentState !== 'listening') return;
            const vol = simulateVol();
            const maxH = 26;

            bars.forEach((bar, i) => {
                const center = 1 - Math.abs((i / (NUM_BARS - 1)) - 0.5) * 1.3;
                const noise = 0.5 + Math.random() * 0.5;
                const target = vol * center * noise * maxH;
                smoothed[i] += (target - smoothed[i]) * 0.22;
                const h = Math.max(2, smoothed[i]);
                bar.style.height = h + 'px';
                // Subtle opacity shift only — no colour change
                bar.style.opacity = (0.35 + (h / maxH) * 0.65).toFixed(2);
            });

            animFrame = requestAnimationFrame(drawFrame);
        }

        function startWave() {
            cancelAnimationFrame(animFrame);
            animFrame = requestAnimationFrame(drawFrame);
        }

        function stopWave() {
            cancelAnimationFrame(animFrame);
            bars.forEach(b => { b.style.height = '2px'; b.style.opacity = '0.3'; });
        }

        // Init
        showState('listening');

        // Auto demo cycle
        setTimeout(() => showState('processing'), 5000);
        setTimeout(() => showState('listening'), 8500);
    </script>
</body>

</html>
